aid: darrow
name: Darrow
description: 'Darrow is an AI legal-intelligence company (founded 2020, offices in New
  York, Miami, Arizona and Tel Aviv) that scans public real-world signals — regulatory
  filings, court dockets, incident reports, corporate disclosures and web behavior —
  to detect legal violations at scale, size the affected class, predict outcomes and
  value the resulting cases. Its platform serves plaintiff law firms (case origination,
  predictive litigation analytics, portfolio management, PlaintiffLink intake), insurers
  (predictive underwriting) and corporate compliance teams (Privacy Radar, listed in
  the Microsoft Marketplace). Darrow publishes no public developer program: the product
  is delivered through an Auth0-protected customer portal at portal.darrow.ai, and the
  only machine-readable surface reachable without credentials is the OpenID Connect
  discovery document served by its identity tenant.'
